[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "motty", email = "motty.mio2@gmail.com" }]
dependencies = [
  "arduino-app-bricks",
  "onnxruntime>=1.26.0",
  "opencv-contrib-python>=4.13.0.92",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pyserial>=3.5",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "opencv-stubs[opencv-contrib]>=0.1.3",
  "poethepoet>=0.46.0",
  "ruff>=0.15.15",
  "types-pyserial>=3.5.0.20260519",
]
luxonis = [
  "depthai>=3.6.1",
]
realsense = [
  "pyrealsense2>=2.58.2.10647",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "onnxruntime",
  "pyrealsense2",
  "depthai",
  "serial",
  "cv2.*",
  "arduino.*"
]
ignore_missing_imports = true

[tool.poe.tasks]
format = [
  { cmd = "ruff format" },
  { cmd = "ruff check --fix" },
]
lint = [
  { cmd = "ruff check" },
]
check = [
  { cmd = "mypy src" },
]

[tool.poe.tasks.export]
cmd = """
uv export \
--no-hashes --no-dev \
--prune arduino-app-bricks \
--format requirements.txt --output-file requirements.txt \
"""

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "RUF", "UP", "TID252"]

[tool.uv.sources]
arduino-app-bricks = { git = "https://github.com/arduino/app-bricks-py", tag = "release/0.10.1" }
