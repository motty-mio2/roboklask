<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Matrix Control</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #1a1a1a;
            text-align: center;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a4a4a;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex-grow: 1;
        }

        .value-display {
            min-width: 3rem;
            text-align: right;
            font-family: monospace;
            font-weight: bold;
            color: #007bff;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>LED Matrix Control</h1>

        <div class="control-group">
            <label for="x_slider">X Coordinate (0.0 - 1.0)</label>
            <div class="slider-container">
                <input type="range" id="x_slider" min="0" max="1" step="0.01" value="0.5">
                <span id="x_val" class="value-display">0.50</span>
            </div>
        </div>

        <div class="control-group">
            <label for="y_slider">Y Coordinate (-1.0 - 1.0)</label>
            <div class="slider-container">
                <input type="range" id="y_slider" min="-1" max="1" step="0.01" value="0.0">
                <span id="y_val" class="value-display">0.00</span>
            </div>
        </div>

        <button onclick="updateLED()">Update LED</button>
        <div id="status">Ready</div>
    </div>

    <script>
        const xSlider = document.getElementById('x_slider');
        const ySlider = document.getElementById('y_slider');
        const xVal = document.getElementById('x_val');
        const yVal = document.getElementById('y_val');
        const status = document.getElementById('status');

        xSlider.oninput = () => xVal.textContent = parseFloat(xSlider.value).toFixed(2);
        ySlider.oninput = () => yVal.textContent = parseFloat(ySlider.value).toFixed(2);

        async function updateLED() {
            const x = parseFloat(xSlider.value);
            const y = parseFloat(ySlider.value);

            status.textContent = 'Updating...';

            try {
                const response = await fetch('/xy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x, y })
                });

                if (response.ok) {
                    status.textContent = `Updated to (${x.toFixed(2)}, ${y.toFixed(2)})`;
                } else {
                    status.textContent = `Error: ${response.status}`;
                }
            } catch (err) {
                status.textContent = 'Connection failed';
                console.error(err);
            }
        }
    </script>
</body>

</html>
